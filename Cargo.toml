[package]
name = "fftlib"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
description = "SIMD-accelerated Rust FFTs with a SciPy-compatible Python interface"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3", "dep:numpy", "pyo3/extension-module"]

[dependencies]
rustfft = "6.4.1"
realfft = "3.5"
rayon = "1.10"
pyo3 = { version = "0.29", optional = true }
numpy = { version = "0.29", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
